services:
  postgres:
    image: 'postgres:16-alpine'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ksadb}
      POSTGRES_USER: ${POSTGRES_USER:-ksauser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ksauser} -d ${POSTGRES_DB:-ksadb}' ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: 'minio/minio:latest'
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?}
    command: server /data --console-address ":9001"
    ports:
      - '9007:9000'
      - '9008:9001'
    volumes:
      - minio_data:/data
    restart: unless-stopped

  backend:
    build:
      context: ./KSA_Kerubisoc_Backend/ksa
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ksadb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ksauser}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?}
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-ksa-storage}
      JWT_SECRET: ${JWT_SECRET:?}
      CERTIFICATE_SIGNING_SECRET: ${CERTIFICATE_SIGNING_SECRET:?}
      CERTIFICATE_VERIFICATION_BASE_URL: ${CERTIFICATE_VERIFICATION_BASE_URL:-http://localhost:9006}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:9005}
      KSA_BOOTSTRAP_ADMIN_EMAIL: ${KSA_BOOTSTRAP_ADMIN_EMAIL:-admin@ksa.org}
      KSA_BOOTSTRAP_ADMIN_PASSWORD: ${KSA_BOOTSTRAP_ADMIN_PASSWORD:-Admin123Pass!}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${KSA_BOOTSTRAP_ADMIN_EMAIL:-admin@ksa.org}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${KSA_BOOTSTRAP_ADMIN_PASSWORD:-Admin123Pass!}
    ports:
      - '9006:8080'
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: [ 'CMD', 'wget', '-qO-', 'http://localhost:8080/actuator/health' ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./ksa-kerubisoc-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:9006}
    ports:
      - '9005:3000'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
