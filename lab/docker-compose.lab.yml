# Isolated vulnerability lab for end-to-end scanner tests.
#
# SAFETY:
#  - The targets sit on an `internal: true` network: no Internet, and NO `ports:` published on the
#    host. They are deliberately vulnerable and must never be reachable from the network.
#  - The scan worker (kerubiscan_deployment-celery-worker-1) is attached to this lab network in
#    ADDITION to its own, so it can reach the targets while keeping its Internet access (needed by
#    vulners.nse and Nuclei templates).
#
# USAGE (on a test host only):
#   # 1. start the lab, attaching the worker to lab-net:
#   docker compose -f lab/docker-compose.lab.yml up -d
#   docker network connect kerubiscan_lab-net <project>-celery-worker-1
#   # 2. run the scans against app.lab.internal / the lab IPs (perimeter: SCAN_ALLOWED_TARGETS)
#   # 3. tear down:
#   docker network disconnect kerubiscan_lab-net <project>-celery-worker-1
#   docker compose -f lab/docker-compose.lab.yml down
#
# Pin images by digest (sha256:...) before relying on this lab for a release (see REVUE_SCANNER.md).

networks:
  lab-net:
    name: kerubiscan_lab-net
    internal: true

volumes:
  lab_certs:

services:
  # Apache httpd 2.4.49 — really vulnerable to CVE-2021-41773 (path traversal / RCE)
  apache-vuln:
    image: vulhub/httpd:2.4.49
    # The image ships "<Directory /> Require all denied", which blocks the path traversal: only
    # version-based detection (Nmap/vulners) then fires and Nuclei rightly finds nothing.
    # Grant / (as in the vulnerable setups seen in the wild) so the exploit really works.
    command:
      - sh
      - -c
      - "sed -i '\\#<Directory />#,\\#</Directory>#s#Require all denied#Require all granted#' /usr/local/apache2/conf/httpd.conf && exec /usr/local/apache2/bin/httpd -DFOREGROUND"
    networks:
      lab-net:
        aliases:
          - app.lab.internal      # domain path: scan "app.lab.internal" instead of the IP
    restart: unless-stopped

  # OWASP Juice Shop — modern web app, many Medium+ findings, no auth to configure
  juice-shop:
    image: bkimminich/juice-shop:v17.1.1
    networks:
      - lab-net
    restart: unless-stopped

  # SSH server with a test account, for the authenticated-scan path
  ssh-target:
    image: linuxserver/openssh-server:version-9.7_p1-r4
    environment:
      - USER_NAME=labuser
      - USER_PASSWORD=labpass123
      - PASSWORD_ACCESS=true
    networks:
      - lab-net
    restart: unless-stopped

  # Self-signed certificate of the shared server, made once (no network: the lab has no Internet)
  lab-certs:
    image: alpine/openssl
    network_mode: none
    entrypoint: ["sh", "-c"]
    command:
      - >-
        [ -f /certs/lab.crt ] || openssl req -x509 -newkey rsa:2048 -nodes -days 3650
        -keyout /certs/lab.key -out /certs/lab.crt -subj /CN=lab.internal
        -addext subjectAltName=DNS:support.lab.internal,DNS:erp.lab.internal,DNS:portal.lab.internal
    volumes:
      - lab_certs:/certs

  # "Shared server": several applications on ONE IP, firewall ports, console on 8080 (edge/nginx.conf).
  # Scan support.lab.internal, erp.lab.internal and portal.lab.internal together (docs/DEPLOIEMENT.md).
  edge:
    image: nginx:1.27-alpine
    depends_on:
      lab-certs:
        condition: service_completed_successfully
    volumes:
      - ./edge/nginx.conf:/etc/nginx/nginx.conf:ro
      - lab_certs:/certs:ro
    networks:
      lab-net:
        aliases:
          - support.lab.internal   # -> Juice Shop
          - erp.lab.internal       # -> Apache 2.4.49
          - portal.lab.internal    # -> error 500
    restart: unless-stopped
