# "Shared server" of the lab: one IP for several applications, shaped like the server seen in front
# of kimia-technologies.com (2026-10-11). It reproduces what broke or slowed the web scans there:
#   - several domains on one IP, each its own application behind a reverse proxy (443);
#   - http:// that only redirects to https:// (80);
#   - services of the server itself, the same whatever the name: a console with a login page
#     (8080) and an API refusing HEAD (8443);
#   - firewall ports accepting the connection then closing it, seen "tcpwrapped" by Nmap
#     (8000, 8008, 8888).
worker_processes 1;
events { worker_connections 256; }

stream {
    # Nothing listens on 127.0.0.1:9: the connection is accepted, then closed
    server { listen 8000; proxy_pass 127.0.0.1:9; proxy_connect_timeout 1s; }
    server { listen 8008; proxy_pass 127.0.0.1:9; proxy_connect_timeout 1s; }
    server { listen 8888; proxy_pass 127.0.0.1:9; proxy_connect_timeout 1s; }
}

http {
    access_log off;
    server_tokens off;
    # Docker's DNS: the applications are looked up at request time, so this proxy starts even if
    # one of them is not up yet
    resolver 127.0.0.11 valid=30s;
    ssl_certificate     /certs/lab.crt;
    ssl_certificate_key /certs/lab.key;

    server {
        listen 80 default_server;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl default_server;
        server_name support.lab.internal;
        location / {
            set $app http://juice-shop:3000;
            proxy_pass $app;
            proxy_set_header Host $host;
        }
    }
    server {
        listen 443 ssl;
        server_name erp.lab.internal;
        location / {
            set $app http://apache-vuln:80;
            proxy_pass $app;
            proxy_set_header Host $host;
        }
    }
    server {
        listen 443 ssl;
        server_name portal.lab.internal;
        return 500;
    }

    server {
        listen 8080 default_server;
        location = /login.html {
            default_type text/html;
            return 200 '<html><body><form method="post" action="/login"><input name="user"><input name="password" type="password"><button>Connexion</button></form></body></html>';
        }
        location / {
            return 307 /login.html;
        }
    }

    server {
        listen 8443 ssl default_server;
        return 405;
    }
}
